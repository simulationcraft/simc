name: ubuntu-test

on:
  workflow_call:

env:
  SIMC_PROFILE: profiles/CI.simc
  SIMC_ARGS: output=/dev/null html=/dev/null json=/dev/null

jobs:
  ubuntu-test:
    name: ${{ matrix.os }}-${{ matrix.compiler }}-cpp-${{ matrix.cppVersion }}-${{ matrix.type }}
    runs-on: ${{ matrix.os }}
    env:
      CACHE_KEY: ubuntu-${{ matrix.compiler }}-for_run-${{ github.sha }}-cpp-${{ matrix.cppVersion }}
      UBSAN_OPTIONS: print_stacktrace=1

    strategy:
      fail-fast: false
      matrix:
        cppVersion: [20, 23]
        compiler: [clang++-16, clang++-20, clang++-22, gcc-12, gcc-13, gcc-15]
        exclude:
          # clang 16 is not happy with c++23
          - compiler: clang++-16
            cppVersion: 23
        include:
          - { compiler: clang++-16, os: ubuntu-24.04 }
          - { compiler: gcc-12,     os: ubuntu-24.04 }
          - { compiler: clang++-20, os: ubuntu-latest }
          - { compiler: clang++-22, os: ubuntu-latest }
          - { compiler: gcc-13,     os: ubuntu-latest }
          - { compiler: gcc-15,     os: ubuntu-latest }

    steps:
      - uses: actions/cache@v5
        with:
          path: |
            ${{ runner.workspace }}/b/ninja/simc
            ActionPriorityLists
            profiles
            .git
          key: ${{ env.CACHE_KEY }}

      - name: "Spell Query"
        run: ${{ runner.workspace }}/b/ninja/simc $SIMC_ARGS spell_query=spell > /dev/null

      - name: "Patchwerk"
        run: ${{ runner.workspace }}/b/ninja/simc $SIMC_ARGS $SIMC_PROFILE iterations=10 cleanup_threads=1

      - name: "DungeonSlice"
        run: ${{ runner.workspace }}/b/ninja/simc $SIMC_ARGS $SIMC_PROFILE iterations=10 fight_style=DungeonSlice allow_experimental_specializations=1 cleanup_threads=1

      - name: Clear Cache
        if: ( matrix.compiler != 'clang++-20' || matrix.cppVersion != '20' ) && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh cache delete ${{ env.CACHE_KEY }}
