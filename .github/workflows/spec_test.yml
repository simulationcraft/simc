name: spec-test

on:
  workflow_call:
    inputs:
      cache-key:
        type: string
        required: true
      is-ptr:
        type: boolean
        required: true

jobs:
  spec-test:
    name: spec-test-${{ matrix.spec }}-${{ matrix.fightstyle }}
    runs-on: ubuntu-22.04
    continue-on-error: ${{ inputs.is-ptr }}

    strategy:
      fail-fast: false
      matrix:
        spec:
          [
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
            monk_windwalker,
          ]

    env:
      UBSAN_OPTIONS: print_stacktrace=1
      SIMC_ARGS: output=/dev/null threads=4 profileset_work_threads=2 iterations=10 cleanup_threads=1 allow_experimental_specializations=1
      PLAYER_ARGS: load_default_gear=1

    steps:
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.workspace }}/b/ninja/simc
            profiles
            tests
            generate_profiles_ci.sh
            .git
          key: ${{ inputs.cache-key }}

      - name: Setup
        id: setup
        env:
          MATRIX_SPEC: ${{ matrix.spec }}
        run: |
          echo "CLASS_STR=${MATRIX_SPEC%%_*}" >> "$GITHUB_ENV"
          echo "SPEC_STR=${MATRIX_SPEC#*_}" >> "$GITHUB_ENV"

      - name: Enable PTR
        if: inputs.is-ptr
        run: echo "PTR_ARG=ptr=1" >> "$GITHUB_ENV"

      - name: "Profileset Test"
        if: always()
        run: |
          ${{ runner.workspace }}/b/ninja/simc ${{ env.PTR_ARG }} ${{ env.SIMC_ARGS }} \
            ${{ env.CLASS_STR }}=${{ matrix.spec }} spec=${{ env.SPEC_STR }} ${{ env.PLAYER_ARGS }} \
            profileset.two_4pc=load_default_talents=1 profileset.two_4pc+=hero_talents=2 \
            profileset.two_4pc+=set_bonus=latest_2pc=1 profileset.two_4pc+=set_bonus+=/latest_4pc=1
            profileset.one_4pc=load_default_talents=1 profileset.one_4pc+=hero_talents=1 \
            profileset.one_4pc+=set_bonus=latest_2pc=1 profileset.one_4pc+=set_bonus+=/latest_4pc=1 \
            profileset.two_2pc=load_default_talents=1 profileset.two_2pc+=hero_talents=2 \
            profileset.two_2pc+=set_bonus=latest_2pc=1 \
            profileset.one_2pc=load_default_talents=1 profileset.one_2pc+=hero_talents=1 \
            profileset.one_2pc+=set_bonus=latest_2pc=1 \
            profileset.two=load_default_talents=1 profileset.two+=hero_talents=2 \
            profileset.one=load_default_talents=1 profileset.one+=hero_talents=1 \
            profileset.base=load_default_talents=1 \
